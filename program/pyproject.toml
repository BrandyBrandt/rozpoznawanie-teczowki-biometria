[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-recognition-project"
version = "0.1.0"
description = "Academic iris recognition pipeline (Project 2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Student" }
]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10"
]

[project.scripts]
iris-pipeline = "iris.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
